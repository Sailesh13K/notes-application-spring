spring.datasource.url=jdbc:h2:mem:notesapp_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.cors.allowed-origins=http://localhost:5173
app.jwt.secret=TEST_SECRET_WITH_ENOUGH_LENGTH_123456789
app.jwt.expiration-ms=86400000
